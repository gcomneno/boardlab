<svg xmlns="http://www.w3.org/2000/svg"
  width="256" height="256" viewBox="0 0 256 256"
  role="img" aria-label="Tiro in porta!">
  <defs>
    <linearGradient id="paint-blue-02" x2="0.85" y2="1">
      <stop stop-color="var(--die-light, #f5ce55)"/>
      <stop offset="1" stop-color="var(--die-dark, #b77b1d)"/>
    </linearGradient>
    <filter id="grain-blue-02">
      <feTurbulence type="fractalNoise"
        baseFrequency=".055" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".11"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="7" y="7" width="242" height="242" rx="35"
    fill="url(#paint-blue-02)" stroke="var(--die-ink, #503a19)" stroke-width="8"/>
  <rect x="13" y="13" width="230" height="230" rx="30"
    fill="white" opacity=".08" filter="url(#grain-blue-02)"/>
  <path d="M29 55 Q128 25 227 55"
    fill="none" stroke="white" stroke-width="5" opacity=".35"/>
  <circle cx="128" cy="112" r="60" fill="white" opacity=".17"/>
  <text x="128" y="135" text-anchor="middle"
    font-size="76" font-family="sans-serif">⚽</text>
  <text x="128" y="192" text-anchor="middle" font-size="16" font-family="sans-serif" font-weight="800" fill="var(--die-ink, #503a19)">Tiro in porta!</text>
</svg>
