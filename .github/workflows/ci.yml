name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Synchronize development environment
        run: uv sync --group dev --locked

      - name: Validate repository
        run: scripts/check-repository.sh

  kotlin-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified Kotlin compiler
        shell: bash
        run: |
          set -euo pipefail
          VERSION=2.4.21
          SHA256=7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
          curl --fail --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${VERSION}/kotlin-compiler-${VERSION}.zip" \
            --output kotlin-compiler.zip
          echo "${SHA256}  kotlin-compiler.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/kotlin"
          unzip -q kotlin-compiler.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          rm kotlin-compiler.zip
      - name: Verify Kotlin domain parity
        run: KOTLINC=kotlinc python3 scripts/check-kotlin-parity.py

  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: boardlab-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
