name: ChronoOops Multiplatform

on:
  pull_request:
    paths:
      - 'src/chrono_oops/**'
      - '.github/workflows/chrono-oops-multiplatform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: C11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: build/chrono-oops/chrono-oops
            launch: ./chrono-oops
          - os: windows-latest
            platform: windows-x64
            executable: build/chrono-oops/Release/chrono-oops.exe
            launch: .\chrono-oops.exe
          - os: macos-latest
            platform: macos-arm64
            executable: build/chrono-oops/chrono-oops
            launch: ./chrono-oops

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Release
        run: >
          cmake -S src/chrono_oops
          -B build/chrono-oops
          -DCMAKE_BUILD_TYPE=Release

      - name: Build CLI and tests
        run: cmake --build build/chrono-oops --config Release --parallel 2

      - name: Run all five C11 tests
        run: >
          ctest --test-dir build/chrono-oops
          --build-config Release
          --output-on-failure

      - name: Stage native executable and instructions
        shell: pwsh
        run: |
          $stage = "dist/chrono-oops-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ matrix.executable }}" "$stage/"
          Copy-Item "src/chrono_oops/README.it.md" "$stage/"
          Copy-Item "src/chrono_oops/README.md" "$stage/"
          @(
            "ChronoOops! - Five-mission campaign"
            "Platform: ${{ matrix.platform }}"
            ""
            "Extract this ZIP before running."
            "Open a terminal in the extracted folder."
            "Run: ${{ matrix.launch }}"
            ""
            "No external runtime dependencies are bundled."
          ) | Set-Content -Encoding utf8 "$stage/RUN.txt"

          $archive = "dist/chrono-oops-${{ matrix.platform }}.zip"
          Push-Location dist
          cmake -E tar cf "chrono-oops-${{ matrix.platform }}.zip" --format=zip "chrono-oops-${{ matrix.platform }}"
          $archiveStatus = $LASTEXITCODE
          Pop-Location
          if ($archiveStatus -ne 0) { throw "ZIP creation failed" }

          if (!(Test-Path $archive)) { throw "Missing ZIP archive" }

      - name: Store ZIP as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrono-oops-${{ matrix.platform }}
          path: dist/chrono-oops-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7
